version: '3.8'

services:
  # Servicio PHP/Laravel
  app:
    build: .
    volumes:
      - .:/var/www/html
      
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - mysql

  # Servicio MySQL
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=laravel
    volumes:
      - mysql_data:/var/lib/mysql

  # Servicio Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app

  # Servicio Node (Vite) - ¡CORRECCIÓN CLAVE!
  node:
    image: node:18
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"  # Expone el puerto de Vite
    command: sh -c "npm install && npm run dev"
    depends_on:
      - app

volumes:
  mysql_data: